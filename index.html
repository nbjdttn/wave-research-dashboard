<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Wave Research</title>
  <meta name="description" content="A daily research briefing: new papers, funding opportunities and publication metrics.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wave Research">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/app.css">
  <script>
    // Apply the saved theme before first paint so there is no flash.
    try {
      var t = localStorage.getItem('wave.theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <script src="assets/js/palettes.js"></script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <!-- The app shell: the page itself never scrolls. Content scrolls inside #scroller; the tab bar,
       settings sheet and messages are placed inside .app, so nothing relies on position: fixed. -->
  <div class="app" id="app">
  <div class="statusfade" aria-hidden="true"></div>
  <div class="ptr" id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.340-5.660M20 4v4.500h-4.500"/></svg></div>

  <div class="scroller" id="scroller">
  <header class="topbar" id="topbar">
    <a class="brand" href="#today" aria-label="Wave Research — today's briefing">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="brand-wave" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#184ed6"/><stop offset="1" stop-color="#14a4e8"/></linearGradient></defs>
        <rect x=".5" y=".5" width="31" height="31" rx="9" fill="#fff" stroke="#d5deea"/>
        <path d="M4.00,17.93L4.33,17.95L4.67,17.96L5.00,17.94L5.33,17.91L5.67,17.88L6.00,17.88L6.33,17.91L6.67,17.98L7.00,18.08L7.33,18.17L7.67,18.23L8.00,18.19L8.33,18.01L8.67,17.67L9.00,17.17L9.33,16.56L9.67,15.93L10.00,15.43L10.33,15.23L10.67,15.47L11.00,16.20L11.33,17.33L11.67,18.68L12.00,19.99L12.33,21.06L12.67,21.77L13.00,22.11L13.33,22.08L13.67,21.63L14.00,20.63L14.33,18.95L14.67,16.58L15.00,13.77L15.33,11.04L15.67,9.04L16.00,8.30L16.33,9.04L16.67,11.04L17.00,13.77L17.33,16.58L17.67,18.95L18.00,20.63L18.33,21.63L18.67,22.08L19.00,22.11L19.33,21.77L19.67,21.06L20.00,19.99L20.33,18.68L20.67,17.33L21.00,16.20L21.33,15.47L21.67,15.23L22.00,15.43L22.33,15.93L22.67,16.56L23.00,17.17L23.33,17.67L23.67,18.01L24.00,18.19L24.33,18.23L24.67,18.17L25.00,18.08L25.33,17.98L25.67,17.91L26.00,17.88L26.33,17.88L26.67,17.91L27.00,17.94L27.33,17.96L27.67,17.95L28.00,17.93" fill="none" stroke="url(#brand-wave)" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">Wave Research</span>
    </a>
    <nav class="topnav" aria-label="Sections">
      <a href="#today" data-tab="today">Today</a>
      <a href="#papers" data-tab="papers">Papers</a>
      <a href="#funding" data-tab="funding">Funding</a>
      <a href="#profile" data-tab="profile">Profile</a>
    </nav>
    <div class="topbar-actions">
      <span class="fresh" id="fresh" hidden></span>
      <button class="icon-btn" id="open-settings" type="button" aria-label="Settings and data sources">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4.500v5M6 14.500v5" /><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <main class="view" id="view" tabindex="-1" aria-live="polite">
    <div class="boot" id="boot">
      <div class="skeleton sk-title"></div>
      <div class="skeleton sk-line"></div>
      <div class="skeleton sk-card"></div>
      <div class="skeleton sk-card"></div>
    </div>
  </main>
  </div>

  <nav class="tabbar" aria-label="Sections">
    <a href="#today" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.500h12.500v13a2 2 0 0 0 2 2H6a2 2 0 0 1-2-2z"/><path d="M16.500 9.500H20v9a1.750 1.750 0 0 1-3.500 0"/><path d="M7.500 9.500h5.500M7.500 13h5.500M7.500 16.500h3"/></svg>
      <span>Today</span>
    </a>
    <a href="#papers" data-tab="papers">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.500h7l4.500 4.500v12.500H7z"/><path d="M14 3.500V8h4.500"/><path d="M10 12.500h5.500M10 16h5.500"/></svg>
      <span>Papers</span>
    </a>
    <a href="#funding" data-tab="funding">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.500"/><path d="M12 7v10M14.800 9.300c-.5-1-1.600-1.500-2.800-1.500-1.600 0-2.800.9-2.800 2.100 0 3 5.800 1.300 5.800 4.300 0 1.200-1.300 2.100-3 2.100-1.400 0-2.600-.6-3.100-1.700"/></svg>
      <span>Funding</span>
    </a>
    <a href="#profile" data-tab="profile">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.500" r="3.750"/><path d="M4.500 20c.7-3.700 3.700-6 7.500-6s6.800 2.300 7.500 6"/></svg>
      <span>Profile</span>
    </a>
  </nav>

  <button class="to-top" id="to-top" type="button" aria-label="Back to top" hidden>
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5.500M6 11.500l6-6 6 6"/></svg>
  </button>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-grip" aria-hidden="true"></div>
    <header class="sheet-head">
      <h2 id="sheet-title">Settings</h2>
      <button class="icon-btn" id="close-sheet" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <div class="tooltip" id="tooltip" role="status" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <noscript><p class="noscript">This dashboard needs JavaScript to load its data.</p></noscript>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
