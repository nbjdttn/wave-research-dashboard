name: Update data

# Rebuilds the dashboard's data every morning and commits it. GitHub Pages then republishes the
# site by itself. Run it by hand any time from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "17 5 * * *"          # every day at 05:17 UTC — ready before the UK morning
  push:
    paths:                        # edit your profile, interests or watch-list → data rebuilds
      - "config/**"
  workflow_dispatch:
    inputs:
      steps:
        description: "What to refresh"
        type: choice
        default: all
        options: [all, profile, citations, papers, grants]

permissions:
  contents: write
  issues: write                   # the "Funding alerts" issue: one comment when a call needs attention

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install --quiet -r requirements.txt

      - name: Refresh data
        env:
          # Optional secrets. Without ANTHROPIC_API_KEY everything still runs; new funding calls
          # are then listed as "awaiting review" instead of being assessed by Claude.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
          STEPS: ${{ inputs.steps }}
        run: |
          if [ -z "$STEPS" ] || [ "$STEPS" = "all" ]; then
            python scripts/update.py
          else
            python scripts/update.py "$STEPS"
          fi

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data assets/img
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit --quiet -m "Daily data refresh ($(date -u +%F))"
          # Someone else may have pushed meanwhile (another run, or the daily agent). The files here are
          # generated, so on a clash this run's fresh copy wins; if it still cannot be published, the
          # next run will do it — a busy branch must not fail the job.
          for attempt in 1 2 3; do
            if git pull --quiet --rebase -X theirs origin "${GITHUB_REF_NAME}" \
               && git push --quiet origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 7
          done
          echo "::warning::This refresh could not be published because the branch kept changing; the next run will publish."
