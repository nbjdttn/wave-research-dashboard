name: Update data

# Rebuilds the dashboard's data every morning and commits it. GitHub Pages then republishes the
# site by itself. Run it by hand any time from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "17 5 * * *"          # every day at 05:17 UTC — ready before the UK morning
  push:
    paths:                        # edit your profile, interests or watch-list → data rebuilds
      - "config/**"
  workflow_dispatch:
    inputs:
      steps:
        description: "What to refresh"
        type: choice
        default: all
        options: [all, profile, citations, papers, grants]

permissions:
  contents: write
  issues: write                   # the "Funding alerts" issue: one comment when a call needs attention

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The branch as it stands now, not the commit that triggered the run: a run that waited in the
      # queue must start from the data and memory the run before it left.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install --quiet -r requirements.txt

      - name: Refresh data
        env:
          # Optional secrets. Without ANTHROPIC_API_KEY everything still runs; new funding calls
          # are then listed as "awaiting review" instead of being assessed by Claude.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
          STEPS: ${{ inputs.steps }}
        run: |
          if [ -z "$STEPS" ] || [ "$STEPS" = "all" ]; then
            python scripts/update.py
          else
            python scripts/update.py "$STEPS"
          fi

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data assets/img
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git diff --cached --name-only --diff-filter=d > "$RUNNER_TEMP/written"
          git diff --cached --name-only --diff-filter=D > "$RUNNER_TEMP/removed"
          git commit --quiet -m "Daily data refresh ($(date -u +%F))"
          ours=$(git rev-parse HEAD)
          # Someone else may have pushed meanwhile (the daily agent, or a change to the code). The files
          # this run wrote are then laid whole on top of the branch as it stands: generated JSON is
          # never merged line by line, which can mix two runs' entries. A busy branch must not fail the
          # job; if it cannot be published, the next run will do it.
          for attempt in 1 2 3; do
            if git push --quiet origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 5
            git fetch --quiet origin "${GITHUB_REF_NAME}"
            git reset --quiet --hard FETCH_HEAD
            xargs -r -d '\n' -a "$RUNNER_TEMP/written" git checkout "$ours" --
            xargs -r -d '\n' -a "$RUNNER_TEMP/removed" git rm -q --ignore-unmatch --
            git add -A data assets/img
            if git diff --cached --quiet; then
              echo "The branch already has these files."
              exit 0
            fi
            git commit --quiet -m "Daily data refresh ($(date -u +%F))"
          done
          echo "::warning::This refresh could not be published because the branch kept changing; the next run will publish."
