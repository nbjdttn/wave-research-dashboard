# ─────────────────────────────────────────────────────────────────────────────
#  Peers — your citation growth beside people at a similar career stage, in the
#  same field, at leading universities. Every curve is counted from the PhD year.
#  Data: OpenAlex (open, no key). Candidates are the authors of papers that cite
#  you or resemble your work.
# ─────────────────────────────────────────────────────────────────────────────
[peers]
enabled            = true
max_peers          = 12
stage_window_years = 3      # PhD awarded within this many years of yours
min_similarity     = 0.4    # 0-1 overlap between their research topics and yours
min_works          = 5
phd_lag_years      = 3      # when a PhD year is not on ORCID: first paper + this many years (shown with ~)
show_names         = true   # false → "Peer A", "Peer B" … (the page and its data are public)

include = []                # OpenAlex author ids to always show, e.g. ["A5066246575"]
exclude = []                # names or OpenAlex ids to leave out

