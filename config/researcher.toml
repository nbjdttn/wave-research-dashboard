max_items     = 140          # papers kept in the feed
min_score     = 0.30         # similarity floor (0–1)
# Journals whose papers get a small boost (your own venues are added automatically).
preferred_venues = [
  "Journal of Fluid Mechanics", "Physical Review Fluids", "Physics of Fluids", "Coastal Engineering",
  "Applied Ocean Research", "Ocean Engineering", "Journal of Geophysical Research", "Geophysical Research Letters",
  "Nature Communications", "Proceedings of the Royal Society A", "Journal of Physical Oceanography",
