# ─────────────────────────────────────────────────────────────────────────────
#  Claude — used only by the scheduled GitHub Action (never by the web page).
#  The API key lives in the repository secret ANTHROPIC_API_KEY.
# ─────────────────────────────────────────────────────────────────────────────
[claude]
model              = "claude-opus-5-5"   # override without editing: repository variable CLAUDE_MODEL
effort             = "medium"            # low | medium | high
max_calls_per_run  = 40                  # spending guard: at most this many analyses per daily run
reanalyse_after_days = 30                # refresh an unchanged call's analysis after this long
scheme_check_days  = 7                   # how often a recurring scheme's page is re-read when unchanged
use_web_tools      = true                # let Claude search/fetch when a funder page blocks the script
# When you edit the [career] or [interests] text above, which existing reviews are redone?
#   "uncertain" – only calls whose eligibility was marked "needs checking" (cheap; the default)
#   "all"       – every call (thorough; roughly $4–5 with the default model)   ·   "none"
reassess_on_profile_change = "uncertain"
