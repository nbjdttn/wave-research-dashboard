#  Edit this file to change what the pipeline looks for; the daily GitHub
#  Action picks the changes up on its next run.
# ─────────────────────────────────────────────────────────────────────────────

[researcher]
name          = "Tim (Tianning) Tang"
short_name    = "Tim Tang"
family_name   = "Tang"
given_initial = "T"
title         = "Lecturer in Fluids Simulation and Digital Twins"
department    = "Department of Mechanical and Aerospace Engineering"
institution   = "The University of Manchester"
location      = "Manchester, UK"
country       = "UK"
tagline       = "Extreme ocean waves, wave–structure interaction and scientific machine learning"

# Identifiers used to pull the publication record.
scholar_id  = "dofRHEwAAAAJ"
orcid       = "0000-0002-6365-9342"
openalex_id = "A5039175173"

bio = """
Tim joined the University of Manchester in 2025 as a Lecturer (Assistant Professor) in Fluids \
Simulation and Digital Twins. He was previously Course Director of the Intelligent Earth CDT and an \
Eric and Wendy Schmidt AI in Science Postdoctoral Fellow at the University of Oxford, where he also \
completed his DPhil. His group studies extreme events in fluid mechanics — rogue waves, wave breaking \
and extreme loads on offshore structures — combining experiments, field data and simulation with \
scientific machine learning."""

[researcher.links]
scholar    = "https://scholar.google.com/citations?user=dofRHEwAAAAJ&hl=en"
orcid      = "https://orcid.org/0000-0002-6365-9342"
university = "https://research.manchester.ac.uk/en/persons/tim-tang-beng-dphil-oxon-afhea/"
website    = "http://tim-tang.com/en"
github     = "https://github.com/nbjdttn"
linkedin   = "https://www.linkedin.com/in/nbjdttn"

