[interests]
summary = """
Extreme events in fluid mechanics with an emphasis on ocean waves: rogue waves and wave statistics, \
nonlinear wave dynamics and instabilities, wave breaking, long–short wave interaction, nonlinear \
wave–structure interaction and extreme loads on offshore wind foundations, tides and coastal \
hydrodynamics, and marine renewable energy. Methods span wave-tank experiments, field data analysis, \
numerical simulation and scientific machine learning — physics-informed neural networks, symbolic \
regression and equation discovery, Gaussian processes, neural operators and reduced-order modelling."""

